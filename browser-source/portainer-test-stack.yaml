# Isolated test deployment. It does not reuse or modify existing Restreamer
# containers, volumes, networks, or published ports.
services:
  restreamer-test:
    image: badincite/restreamer:bundle-fcfa2a5f789b-ui-b6719e6cac83
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    environment:
      CORE_RTMP_ENABLE: "true"
      CORE_RTMP_APP: /live
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - restreamer-test-config:/core/config
      - restreamer-test-data:/core/data

  browser-source:
    image: badincite/restreamer:browser-experimental
    restart: unless-stopped
    depends_on:
      - restreamer-test
    cpus: 7.0
    mem_limit: 1536m
    shm_size: 512m
    environment:
      BROWSER_URL: about:blank
      BROWSER_WIDTH: ${BROWSER_WIDTH:-1280}
      BROWSER_HEIGHT: ${BROWSER_HEIGHT:-720}
      BROWSER_FPS: ${BROWSER_FPS:-12}
      BROWSER_RTMP_URL: rtmp://restreamer-test:1935/live/browser.stream
    volumes:
      - browser-test-profile:/home/browser/profile
    ports:
      - "127.0.0.1:16081:6080"

  browser-control:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - browser-source
    cpus: 0.25
    mem_limit: 128m
    environment:
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:?Set a browser-control password in Portainer}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        hash="$$(caddy hash-password --plaintext "$$CONTROL_PASSWORD")"
        printf '{\n  default_sni 127.0.0.1\n}\nhttps://127.0.0.1:16080 {\n  tls internal\n  basic_auth {\n    admin %s\n  }\n  reverse_proxy browser-source:6080 {\n    header_up -Authorization\n  }\n}\n' "$$hash" > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "127.0.0.1:16080:16080"
    volumes:
      - browser-control-data:/data
      - browser-control-config:/config

volumes:
  restreamer-test-config:
  restreamer-test-data:
  browser-test-profile:
  browser-control-data:
  browser-control-config:
