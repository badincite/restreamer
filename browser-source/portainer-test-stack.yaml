# Isolated test deployment. It does not reuse or modify existing Restreamer
# containers, volumes, networks, or published ports.
services:
  restreamer-test:
    image: badincite/restreamer:bundle-879ac3a70ee7-ui-67cc21b1fabc
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    environment:
      CORE_RTMP_ENABLE: "true"
      CORE_RTMP_APP: /live
    ports:
      - "192.168.1.11:18080:8080"
    volumes:
      - restreamer-test-config:/core/config
      - restreamer-test-data:/core/data

  browser-source:
    image: badincite/restreamer:browser-experimental
    restart: unless-stopped
    depends_on:
      - restreamer-test
    cpus: 1.0
    mem_limit: 1536m
    shm_size: 512m
    environment:
      BROWSER_URL: https://seasons4u.com/
      BROWSER_WIDTH: "854"
      BROWSER_HEIGHT: "480"
      BROWSER_FPS: "12"
      BROWSER_RTMP_URL: rtmp://restreamer-test:1935/live/browser.stream
    volumes:
      - browser-test-profile:/home/browser/profile

  browser-control:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - browser-source
    cpus: 0.25
    mem_limit: 128m
    environment:
      CONTROL_PASSWORD: ${CONTROL_PASSWORD:?Set a browser-control password in Portainer}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      hash="$$(caddy hash-password --plaintext "$$CONTROL_PASSWORD")"
      printf 'https://192.168.1.11:16080 {\n  tls internal\n  basic_auth {\n    admin %s\n  }\n  reverse_proxy browser-source:6080\n}\n' "$$hash" > /tmp/Caddyfile
      exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "192.168.1.11:16080:16080"
    volumes:
      - browser-control-data:/data
      - browser-control-config:/config

volumes:
  restreamer-test-config:
  restreamer-test-data:
  browser-test-profile:
  browser-control-data:
  browser-control-config:
