name: Publish badincite Restreamer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Restreamer bundle
        uses: actions/checkout@v4

      - name: Check out badincite UI
        uses: actions/checkout@v4
        with:
          repository: badincite/restreamer-ui
          ref: main
          path: ui

      - name: Record source revisions
        id: revisions
        shell: bash
        run: |
          echo "bundle=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "ui=$(git -C ui rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: badincite
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.badincite
          platforms: linux/amd64
          push: true
          tags: |
            badincite/restreamer:latest
            badincite/restreamer:bundle-${{ steps.revisions.outputs.bundle }}-ui-${{ steps.revisions.outputs.ui }}
          labels: |
            org.opencontainers.image.source=https://github.com/badincite/restreamer
            org.opencontainers.image.revision=${{ github.sha }}
