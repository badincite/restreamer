name: Browser source image

on:
  push:
    branches: [2.x]
    paths:
      - browser-source/**
      - .github/workflows/browser-source.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Portainer test stack
        run: |
          CONTROL_PASSWORD=ci-test-only docker compose -f browser-source/portainer-test-stack.yaml config --quiet
          CONTROL_PASSWORD=ci-test-only docker compose -f browser-source/portainer-test-stack.yaml config --format json \
            | jq -e '.services["browser-control"].command | length == 1'

      - uses: docker/setup-buildx-action@v3

      - name: Build browser source image
        uses: docker/build-push-action@v6
        with:
          context: browser-source
          file: browser-source/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: browser-source:smoke

      - name: Smoke test browser, control page, and capture inputs
        shell: bash
        run: |
          docker run -d --name browser-source-smoke \
            -e BROWSER_URL=about:blank \
            -p 127.0.0.1:6081:6080 \
            --shm-size=1g browser-source:smoke
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:6081/vnc.html > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:6081/vnc.html > /dev/null
          docker exec browser-source-smoke python3 -c \
            "import socket; s=socket.create_connection(('127.0.0.1',5900),5); s.settimeout(5); assert s.recv(12).startswith(b'RFB '), 'VNC did not send its banner'"
          timeout 30s docker exec browser-source-smoke ffmpeg -hide_banner -loglevel error \
            -f x11grab -video_size 1280x720 -framerate 5 -i :99.0 \
            -f pulse -i browser_sink.monitor \
            -t 3 -c:v libx264 -c:a aac -f null -
          docker restart browser-source-smoke
          for attempt in {1..30}; do
            if docker exec browser-source-smoke python3 -c \
              "import socket; s=socket.create_connection(('127.0.0.1',5900),2); s.settimeout(2); assert s.recv(12).startswith(b'RFB ')"; then
              break
            fi
            sleep 2
          done
          docker exec browser-source-smoke python3 -c \
            "import socket; s=socket.create_connection(('127.0.0.1',5900),5); s.settimeout(5); assert s.recv(12).startswith(b'RFB '), 'VNC failed after restart'"

      - name: Show container logs if smoke test failed
        if: failure()
        run: docker logs browser-source-smoke

      - name: Remove smoke test container
        if: always()
        run: docker rm -f browser-source-smoke || true

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: badincite
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish experimental browser source
        uses: docker/build-push-action@v6
        with:
          context: browser-source
          file: browser-source/Dockerfile
          platforms: linux/amd64
          push: true
          tags: badincite/restreamer:browser-experimental
